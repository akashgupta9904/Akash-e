<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders Management | Nexus Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <img src="/favicon.svg" alt="Akash X Store" style="width: 28px; height: 28px;">
        AKASH X <span>ADMIN</span>
      </div>
      <ul class="sidebar-nav">
        <li class="nav-item" data-nav="dashboard"><a href="/admin/index.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
        <li class="nav-item" data-nav="products"><a href="/admin/products.html"><i class="fa-solid fa-box-archive"></i> Products Inventory</a></li>
        <li class="nav-item" data-nav="orders"><a href="/admin/orders.html"><i class="fa-solid fa-cart-shopping"></i> Customer Orders</a></li>
        <li class="nav-item" data-nav="categories"><a href="/admin/categories.html"><i class="fa-solid fa-layer-group"></i> Categories</a></li>
        <li class="nav-item" data-nav="coupons"><a href="/admin/coupons.html"><i class="fa-solid fa-ticket"></i> Coupons & Promos</a></li>
        <li class="nav-item" data-nav="customers"><a href="/admin/customers.html"><i class="fa-solid fa-users"></i> Customers</a></li>
      </ul>
      <div class="sidebar-footer">
        <a href="/" target="_blank" style="display: flex; align-items: center; gap: 0.5rem; color: #94a3b8; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.75rem;">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> View Storefront
        </a>
        <button onclick="API.logout()" style="width: 100%; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; background: none; border: none; color: var(--danger); font-size: 0.88rem; font-weight: 600; cursor: pointer;">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
        </button>
      </div>
    </aside>

    <!-- Main -->
    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button id="adminSidebarToggle" class="btn btn-secondary btn-sm"><i class="fa-solid fa-bars"></i></button>
          <h1 class="admin-page-title">Orders Fulfillment</h1>
        </div>
      </header>

      <main class="admin-body">
        
        <div class="admin-card">
          <div class="card-header-flex">
            <div style="display: flex; gap: 0.75rem; flex: 1; max-width: 500px;">
              <input type="text" id="orderSearchInput" class="form-control" placeholder="Search by Order # or Customer Name...">
            </div>

            <div style="display: flex; gap: 0.5rem; align-items: center;">
              <label style="font-size: 0.85rem; font-weight: 600;">Status:</label>
              <select id="statusFilter" class="form-control" style="width: auto;">
                <option value="all">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="processing">Processing</option>
                <option value="shipped">Shipped</option>
                <option value="delivered">Delivered</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Order #</th>
                  <th>Customer Info</th>
                  <th>Date</th>
                  <th>Total Amount</th>
                  <th>Payment Status</th>
                  <th>Order Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="ordersTableBody">
                <tr><td colspan="7" style="text-align: center; padding: 3rem;">Loading orders...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Update Status Modal -->
  <div class="modal-overlay" id="statusModal">
    <div class="modal-card" style="max-width: 440px;">
      <div class="modal-header">
        <h3>Update Order Status</h3>
        <button onclick="AdminApp.closeModal('statusModal')" style="background: none; border: none; font-size: 1.25rem; cursor: pointer;">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="statusOrderId">
        <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.25rem;">
          Order: <strong id="modalOrderNum" style="color: var(--text-main);"></strong>
        </p>

        <div class="form-group">
          <label>Order Status</label>
          <select id="modalOrderStatus" class="form-control">
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div class="form-group">
          <label>Payment Status</label>
          <select id="modalPaymentStatus" class="form-control">
            <option value="pending">Pending</option>
            <option value="paid">Paid</option>
            <option value="failed">Failed</option>
            <option value="refunded">Refunded</option>
          </select>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
          <button class="btn btn-secondary" onclick="AdminApp.closeModal('statusModal')">Cancel</button>
          <button class="btn btn-primary" onclick="saveStatusUpdate()">Save Update</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let allOrders = [];

    document.addEventListener('DOMContentLoaded', () => {
      AdminApp.initLayout('orders');
      loadOrders();

      document.getElementById('statusFilter').onchange = () => loadOrders();
      document.getElementById('orderSearchInput').oninput = (e) => {
        const q = e.target.value.toLowerCase().trim();
        const filtered = allOrders.filter(o => o.order_number.toLowerCase().includes(q) || o.customer_name.toLowerCase().includes(q) || o.customer_email.toLowerCase().includes(q));
        renderOrders(filtered);
      };
    });

    async function loadOrders() {
      const status = document.getElementById('statusFilter').value;
      try {
        const res = await API.get('/admin/orders', { status });
        allOrders = res.orders || [];
        renderOrders(allOrders);
      } catch (err) {
        API.showToast(err.message, 'error');
      }
    }

    function renderOrders(orders) {
      const tbody = document.getElementById('ordersTableBody');
      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 2.5rem; color: var(--text-muted);">No orders found matching criteria.</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(o => `
        <tr>
          <td>
            <strong style="font-family: 'Outfit'; font-size: 0.95rem; color: var(--text-main);">${o.order_number}</strong>
          </td>
          <td>
            <strong>${o.customer_name}</strong><br>
            <small style="color: var(--text-muted);">${o.customer_email}</small><br>
            <small style="color: var(--text-light);">${o.customer_phone}</small>
          </td>
          <td>${new Date(o.created_at).toLocaleDateString()}</td>
          <td style="font-weight: 800; font-family: 'Outfit'; color: var(--text-main);">
            ${API.formatPrice(o.total_amount)}
          </td>
          <td>
            <span class="badge ${o.payment_status === 'paid' ? 'badge-success' : 'badge-warning'}">
              ${o.payment_status}
            </span>
          </td>
          <td>
            <span class="badge ${o.order_status === 'delivered' ? 'badge-success' : (o.order_status === 'cancelled' ? 'badge-danger' : 'badge-primary')}">
              ${o.order_status}
            </span>
          </td>
          <td>
            <div style="display: flex; gap: 0.4rem;">
              <button class="btn btn-secondary btn-sm" onclick="openStatusModal(${o.id}, '${o.order_number}', '${o.order_status}', '${o.payment_status}')">
                <i class="fa-solid fa-pen-to-square"></i> Status
              </button>
              <a href="/order-success.html?orderNumber=${o.order_number}" target="_blank" class="btn btn-secondary btn-sm" title="View Full Receipt">
                <i class="fa-solid fa-eye"></i>
              </a>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openStatusModal(id, num, orderStatus, paymentStatus) {
      document.getElementById('statusOrderId').value = id;
      document.getElementById('modalOrderNum').textContent = num;
      document.getElementById('modalOrderStatus').value = orderStatus;
      document.getElementById('modalPaymentStatus').value = paymentStatus;
      AdminApp.openModal('statusModal');
    }

    async function saveStatusUpdate() {
      const id = document.getElementById('statusOrderId').value;
      const order_status = document.getElementById('modalOrderStatus').value;
      const payment_status = document.getElementById('modalPaymentStatus').value;

      try {
        await API.put(`/admin/orders/${id}/status`, { order_status, payment_status });
        API.showToast('Order status updated successfully!', 'success');
        AdminApp.closeModal('statusModal');
        loadOrders();
      } catch (err) {
        API.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
