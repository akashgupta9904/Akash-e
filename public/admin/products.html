<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products Inventory | Nexus Admin</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <img src="/favicon.svg" alt="Akash X Store" style="width: 28px; height: 28px;">
        AKASH X <span>ADMIN</span>
      </div>

      <ul class="sidebar-nav">
        <li class="nav-item" data-nav="dashboard"><a href="/admin/index.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
        <li class="nav-item" data-nav="products"><a href="/admin/products.html"><i class="fa-solid fa-box-archive"></i> Products Inventory</a></li>
        <li class="nav-item" data-nav="orders"><a href="/admin/orders.html"><i class="fa-solid fa-cart-shopping"></i> Customer Orders</a></li>
        <li class="nav-item" data-nav="categories"><a href="/admin/categories.html"><i class="fa-solid fa-layer-group"></i> Categories</a></li>
        <li class="nav-item" data-nav="coupons"><a href="/admin/coupons.html"><i class="fa-solid fa-ticket"></i> Coupons & Promos</a></li>
        <li class="nav-item" data-nav="customers"><a href="/admin/customers.html"><i class="fa-solid fa-users"></i> Customers</a></li>
      </ul>

      <div class="sidebar-footer">
        <a href="/" target="_blank" style="display: flex; align-items: center; gap: 0.5rem; color: #94a3b8; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.75rem;">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> View Storefront
        </a>
        <button onclick="API.logout()" style="width: 100%; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; background: none; border: none; color: var(--danger); font-size: 0.88rem; font-weight: 600; cursor: pointer;">
          <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
        </button>
      </div>
    </aside>

    <!-- Main -->
    <div class="admin-main">
      <header class="admin-topbar">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button id="adminSidebarToggle" class="btn btn-secondary btn-sm"><i class="fa-solid fa-bars"></i></button>
          <h1 class="admin-page-title">Products Inventory</h1>
        </div>
        <button class="btn btn-primary btn-sm" onclick="openAddProductModal()">
          <i class="fa-solid fa-plus"></i> Add New Product
        </button>
      </header>

      <main class="admin-body">
        
        <div class="admin-card">
          <div class="card-header-flex">
            <input type="text" id="adminProductSearch" class="form-control" placeholder="Search by product name..." style="max-width: 320px;">
            <span id="productCountBadge" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">0 products loaded</span>
          </div>

          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Discount</th>
                  <th>Stock</th>
                  <th>Featured</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="productsTableBody">
                <tr><td colspan="7" style="text-align: center; padding: 3rem;">Loading inventory...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Add/Edit Product Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle" style="font-size: 1.25rem;">Add New Product</h3>
        <button onclick="AdminApp.closeModal('productModal')" style="background: none; border: none; font-size: 1.25rem; cursor: pointer;">&times;</button>
      </div>
      <div class="modal-body">
        <form id="productForm">
          <input type="hidden" id="editProductId">

          <div class="form-group">
            <label>Product Name *</label>
            <input type="text" id="pName" class="form-control" required placeholder="e.g. Studio Pro Headphones">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Category *</label>
              <select id="pCategory" class="form-control" required>
                <!-- Populated via JS -->
              </select>
            </div>
            <div class="form-group">
              <label>Price (₹) *</label>
              <input type="number" id="pPrice" class="form-control" required min="1" step="0.01">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Discount (%)</label>
              <input type="number" id="pDiscount" class="form-control" min="0" max="100" value="0">
            </div>
            <div class="form-group">
              <label>Available Stock *</label>
              <input type="number" id="pStock" class="form-control" min="0" value="10" required>
            </div>
          </div>

          <div class="form-group">
            <label>Product Image</label>
            <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
              <input type="file" id="pImageFile" accept="image/*" class="form-control">
              <button type="button" class="btn btn-secondary btn-sm" onclick="uploadSelectedImage()">Upload</button>
            </div>
            <input type="text" id="pImageUrl" class="form-control" placeholder="Or enter Image URL (https://...)">
            <div id="imagePreviewWrap" style="margin-top: 0.5rem; display: none;">
              <img id="previewImg" src="" alt="Preview" style="height: 80px; border-radius: 6px; object-fit: cover;">
            </div>
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea id="pDescription" class="form-control" rows="3" placeholder="Detailed product specifications..."></textarea>
          </div>

          <div class="form-group">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="checkbox" id="pFeatured" style="width: 18px; height: 18px; accent-color: var(--primary);">
              <span>Mark as Featured Product on Homepage</span>
            </label>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
            <button type="button" class="btn btn-secondary" onclick="AdminApp.closeModal('productModal')">Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveProductBtn">Save Product</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    let allProducts = [];
    let categoriesList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      AdminApp.initLayout('products');
      await loadCategories();
      await loadProducts();

      document.getElementById('adminProductSearch').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        const filtered = allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.category_name && p.category_name.toLowerCase().includes(q)));
        renderTable(filtered);
      });

      document.getElementById('productForm').addEventListener('submit', handleSaveProduct);
    });

    async function loadCategories() {
      try {
        const res = await API.get('/categories');
        categoriesList = res.categories || [];
        const select = document.getElementById('pCategory');
        select.innerHTML = categoriesList.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      } catch (e) {}
    }

    async function loadProducts() {
      try {
        const res = await API.get('/admin/products');
        allProducts = res.products || [];
        document.getElementById('productCountBadge').textContent = `${allProducts.length} products loaded`;
        renderTable(allProducts);
      } catch (err) {
        API.showToast(err.message, 'error');
      }
    }

    function renderTable(products) {
      const tbody = document.getElementById('productsTableBody');
      if (products.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; padding: 2rem; color: var(--text-muted);">No products found.</td></tr>`;
        return;
      }

      tbody.innerHTML = products.map(p => `
        <tr>
          <td>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <img src="${p.image_url}" alt="${p.name}" style="width: 44px; height: 44px; border-radius: 8px; object-fit: cover;">
              <div>
                <a href="/product.html?slug=${p.slug}" target="_blank" style="font-weight: 700; color: var(--text-main);">${p.name}</a>
                <div style="font-size: 0.75rem; color: var(--text-muted);">Slug: ${p.slug}</div>
              </div>
            </div>
          </td>
          <td><span class="badge badge-primary">${p.category_name || 'Uncategorized'}</span></td>
          <td style="font-weight: 700;">${API.formatPrice(p.price)}</td>
          <td>${p.discount_percent > 0 ? `<span class="badge badge-accent">-${p.discount_percent}%</span>` : '0%'}</td>
          <td>
            <span class="badge ${p.stock <= 5 ? 'badge-danger' : 'badge-success'}">${p.stock} units</span>
          </td>
          <td>${p.is_featured ? '<i class="fa-solid fa-star" style="color: var(--warning);"></i>' : '—'}</td>
          <td>
            <div style="display: flex; gap: 0.4rem;">
              <button class="btn btn-secondary btn-sm" onclick="editProduct(${p.id})"><i class="fa-solid fa-pen"></i></button>
              <button class="btn btn-secondary btn-sm" style="color: var(--danger);" onclick="deleteProduct(${p.id}, '${p.name.replace(/'/g, "\\'")}')"><i class="fa-solid fa-trash"></i></button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openAddProductModal() {
      document.getElementById('modalTitle').textContent = 'Add New Product';
      document.getElementById('editProductId').value = '';
      document.getElementById('pName').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pDiscount').value = '0';
      document.getElementById('pStock').value = '10';
      document.getElementById('pImageUrl').value = '';
      document.getElementById('pDescription').value = '';
      document.getElementById('pFeatured').checked = false;
      document.getElementById('imagePreviewWrap').style.display = 'none';
      AdminApp.openModal('productModal');
    }

    function editProduct(id) {
      const p = allProducts.find(item => item.id === id);
      if (!p) return;

      document.getElementById('modalTitle').textContent = 'Edit Product';
      document.getElementById('editProductId').value = p.id;
      document.getElementById('pName').value = p.name;
      document.getElementById('pCategory').value = p.category_id || '';
      document.getElementById('pPrice').value = p.price;
      document.getElementById('pDiscount').value = p.discount_percent;
      document.getElementById('pStock').value = p.stock;
      document.getElementById('pImageUrl').value = p.image_url || '';
      document.getElementById('pDescription').value = p.description || '';
      document.getElementById('pFeatured').checked = !!p.is_featured;

      if (p.image_url) {
        document.getElementById('previewImg').src = p.image_url;
        document.getElementById('imagePreviewWrap').style.display = 'block';
      }

      AdminApp.openModal('productModal');
    }

    async function uploadSelectedImage() {
      const fileInput = document.getElementById('pImageFile');
      if (!fileInput.files || fileInput.files.length === 0) {
        API.showToast('Please select an image file first', 'warning');
        return;
      }

      try {
        const url = await AdminApp.uploadImage(fileInput);
        document.getElementById('pImageUrl').value = url;
        document.getElementById('previewImg').src = url;
        document.getElementById('imagePreviewWrap').style.display = 'block';
        API.showToast('Image uploaded successfully!', 'success');
      } catch (err) {
        API.showToast(err.message || 'Image upload failed', 'error');
      }
    }

    async function handleSaveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('editProductId').value;
      const body = {
        name: document.getElementById('pName').value.trim(),
        category_id: document.getElementById('pCategory').value,
        price: document.getElementById('pPrice').value,
        discount_percent: document.getElementById('pDiscount').value,
        stock: document.getElementById('pStock').value,
        image_url: document.getElementById('pImageUrl').value.trim(),
        description: document.getElementById('pDescription').value.trim(),
        is_featured: document.getElementById('pFeatured').checked ? 1 : 0
      };

      try {
        if (id) {
          await API.put(`/admin/products/${id}`, body);
          API.showToast('Product updated successfully!', 'success');
        } else {
          await API.post('/admin/products', body);
          API.showToast('Product added successfully!', 'success');
        }

        AdminApp.closeModal('productModal');
        loadProducts();
      } catch (err) {
        API.showToast(err.message || 'Failed to save product', 'error');
      }
    }

    async function deleteProduct(id, name) {
      if (!confirm(`Are you sure you want to delete "${name}"?`)) return;
      try {
        await API.delete(`/admin/products/${id}`);
        API.showToast('Product deleted', 'success');
        loadProducts();
      } catch (err) {
        API.showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
