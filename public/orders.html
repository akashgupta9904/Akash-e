<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders & Tracking | Akash X Store</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .order-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand-logo">
        <img src="/favicon.svg" alt="Akash X Store" style="width: 32px; height: 32px;">
        AKASH X <span>STORE</span>
      </a>

      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/shop.html">Shop Catalog</a></li>
        <li><a href="/orders.html" class="active">My Orders</a></li>
      </ul>

      <div class="nav-actions">
        <div class="auth-nav-slot"></div>
        <a href="/cart.html" class="icon-btn" aria-label="Shopping Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="cart-count" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main style="padding: 3rem 0 5rem;">
    <div class="container" style="max-width: 900px;">
      
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 style="font-size: 2.2rem; margin-bottom: 0.25rem;">My Orders</h1>
          <p style="color: var(--text-muted);">Track shipments, inspect invoices and order history.</p>
        </div>

        <!-- Direct Lookup -->
        <div style="display: flex; gap: 0.5rem;">
          <input type="text" id="lookupInput" class="form-control" placeholder="Search Order # (e.g. NX-...)" style="width: 220px; font-size: 0.85rem;">
          <button class="btn btn-primary btn-sm" onclick="lookupOrder()">Find</button>
        </div>
      </div>

      <div id="ordersContainer">
        <div style="text-align: center; padding: 4rem;">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--primary);"></i>
          <p style="margin-top: 0.5rem; color: var(--text-muted);">Fetching order records...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('ordersContainer');

      if (!API.isLoggedIn()) {
        container.innerHTML = `
          <div style="background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 3rem 2rem; text-align: center;">
            <div style="font-size: 3rem; color: var(--primary); margin-bottom: 1rem;">
              <i class="fa-solid fa-user-lock"></i>
            </div>
            <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Sign In to View Your Order History</h2>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem; max-width: 460px; margin-left: auto; margin-right: auto;">
              Logging in lets you see all past orders, delivery tracking, and invoice downloads. Or look up an order number directly above.
            </p>
            <div style="display: flex; justify-content: center; gap: 1rem;">
              <a href="/login.html" class="btn btn-primary">Sign In</a>
              <a href="/shop.html" class="btn btn-secondary">Explore Catalog</a>
            </div>
          </div>
        `;
        return;
      }

      try {
        const res = await API.get('/orders/my');
        if (!res.orders || res.orders.length === 0) {
          container.innerHTML = `
            <div style="background: #fff; border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 4rem 2rem; text-align: center;">
              <div style="font-size: 3rem; color: var(--text-light); margin-bottom: 1rem;">
                <i class="fa-solid fa-box-open"></i>
              </div>
              <h2 style="font-size: 1.4rem; margin-bottom: 0.5rem;">No orders placed yet</h2>
              <p style="color: var(--text-muted); margin-bottom: 1.5rem;">When you purchase items, they will appear here with live tracking.</p>
              <a href="/shop.html" class="btn btn-primary">Start Shopping</a>
            </div>
          `;
          return;
        }

        container.innerHTML = res.orders.map(order => `
          <div class="order-card">
            <div class="order-card-header">
              <div>
                <span style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase;">Order #</span>
                <div style="font-weight: 800; font-family: 'Outfit'; font-size: 1.15rem; color: var(--text-main);">${order.order_number}</div>
                <div style="font-size: 0.8rem; color: var(--text-light); margin-top: 0.15rem;">Placed on ${new Date(order.created_at).toLocaleDateString()}</div>
              </div>

              <div style="display: flex; gap: 0.5rem; align-items: center;">
                <span class="badge ${order.order_status === 'delivered' ? 'badge-success' : 'badge-primary'}">${order.order_status}</span>
                <span class="badge ${order.payment_status === 'paid' ? 'badge-success' : 'badge-warning'}">${order.payment_status}</span>
              </div>
            </div>

            <!-- Items -->
            <div style="margin-bottom: 1rem;">
              ${order.items.map(it => `
                <div style="display: flex; justify-content: space-between; font-size: 0.92rem; margin-bottom: 0.4rem;">
                  <span>${it.quantity} × ${it.product_name}</span>
                  <span style="font-weight: 600;">${API.formatPrice(it.subtotal)}</span>
                </div>
              `).join('')}
            </div>

            <!-- Footer -->
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1rem; flex-wrap: wrap; gap: 0.75rem;">
              <div style="font-size: 1.15rem; font-weight: 800; font-family: 'Outfit';">
                Total: <span style="color: var(--primary);">${API.formatPrice(order.total_amount)}</span>
              </div>
              <a href="/order-success.html?orderNumber=${order.order_number}" class="btn btn-secondary btn-sm">
                <i class="fa-solid fa-receipt"></i> View Invoice
              </a>
            </div>
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = `<div style="color: var(--danger); text-align: center;">Error: ${err.message}</div>`;
      }
    });

    function lookupOrder() {
      const num = document.getElementById('lookupInput').value.trim();
      if (!num) {
        API.showToast('Please enter an order number', 'warning');
        return;
      }
      window.location.href = `/order-success.html?orderNumber=${encodeURIComponent(num)}`;
    }
  </script>
</body>
</html>
