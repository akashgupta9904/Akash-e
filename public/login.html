<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Owner Access | AKASH X STORE</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #060d1a;
      color: #fff;
      padding: 1.5rem;
      font-family: 'Poppins', sans-serif;
      position: relative;
      overflow: hidden;
    }
    .login-box {
      width: 100%;
      max-width: 400px;
      background: rgba(10, 19, 36, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-green);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 0 40px rgba(126, 200, 227, 0.25);
      position: relative;
      z-index: 10;
      text-align: center;
    }
    .logo-avatar {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--neon-green-bright);
      box-shadow: 0 0 20px rgba(126, 200, 227, 0.4);
      margin-bottom: 1.25rem;
    }
    .title {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 1px;
      margin: 0 0 6px;
      color: #fff;
      font-family: var(--font-display);
    }
    .sub {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-field {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(15, 27, 50, 0.8);
      border: 1px solid var(--border-green);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      border-color: var(--neon-green-bright);
      box-shadow: 0 0 15px rgba(126, 200, 227, 0.35);
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: var(--neon-green-bright);
      color: #060d1a;
      border: none;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 0.5rem;
      box-shadow: 0 0 20px rgba(126, 200, 227, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(126, 200, 227, 0.6);
    }
    .quick-unlock {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(126, 200, 227, 0.15);
    }
    .quick-btn {
      width: 100%;
      padding: 10px;
      background: rgba(126, 200, 227, 0.1);
      border: 1px dashed var(--border-green);
      color: var(--neon-green-bright);
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- Ambient Orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="login-box">
    <img src="/assets/img/logo.png" alt="Akash X Store" class="logo-avatar">
    <h1 class="title">👑 OWNER ACCESS</h1>
    <p class="sub">Private Panel & Store Management</p>

    <form id="ownerLoginForm" onsubmit="handleOwnerLogin(event)">
      <div class="form-group">
        <label>User ID</label>
        <input type="text" id="ownerEmail" class="input-field" placeholder="User ID" value="akash@4141" required autofocus>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="ownerPassword" class="input-field" placeholder="Password" value="4141" required>
      </div>

      <button type="submit" class="submit-btn" id="loginBtn">
        <i class="fa-solid fa-lock-open"></i> Unlock Dashboard
      </button>
    </form>

    <div class="quick-unlock">
      <button type="button" class="quick-btn" onclick="quickLogin()">
        <i class="fa-solid fa-bolt"></i> 1-Tap Unlock As Akash (akash@4141)
      </button>
      <div style="margin-top: 1.25rem;">
        <a href="/" style="color: var(--text-muted); font-size: 0.8rem; text-decoration: none;">
          ← Back to Storefront
        </a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // If already logged in as admin, redirect directly
    if (API.isAdmin()) {
      window.location.href = '/admin/index.html';
    }

    async function handleOwnerLogin(e) {
      if (e) e.preventDefault();
      const email = document.getElementById('ownerEmail').value.trim();
      const pwd = document.getElementById('ownerPassword').value;
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';

      try {
        const res = await API.post('/auth/login', {
          email: email,
          password: pwd
        });

        if (res.token && res.user) {
          API.setToken(res.token);
          API.setUser(res.user);
          window.location.href = '/admin/index.html';
        } else {
          alert('Invalid User ID or Password! Please try again.');
        }
      } catch (err) {
        alert('Authentication failed: ' + (err.message || 'Incorrect credentials'));
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-lock-open"></i> Unlock Dashboard';
      }
    }

    function quickLogin() {
      document.getElementById('ownerEmail').value = 'akash@4141';
      document.getElementById('ownerPassword').value = '4141';
      handleOwnerLogin();
    }
  </script>
</body>
</html>
