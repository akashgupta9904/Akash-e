<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | Akash X Store</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .success-card {
      max-width: 780px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-sm);
    }
    .timeline-steps {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 2.5rem 0;
    }
    .timeline-steps::before {
      content: '';
      position: absolute;
      top: 18px;
      left: 10%;
      right: 10%;
      height: 3px;
      background: #e2e8f0;
      z-index: 1;
    }
    .timeline-step {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      text-align: center;
    }
    .step-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #e2e8f0;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .timeline-step.completed .step-icon {
      background: var(--success);
      color: #fff;
    }
    .timeline-step.active .step-icon {
      background: var(--primary);
      color: #fff;
    }
    @media print {
      .navbar, .footer, .btn, .mobile-bottom-bar { display: none !important; }
      .success-card { border: none; box-shadow: none; padding: 0; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand-logo">
        <img src="/favicon.svg" alt="Akash X Store" style="width: 32px; height: 32px;">
        AKASH X <span>STORE</span>
      </a>
      <div class="nav-actions">
        <a href="/orders.html" class="btn btn-secondary btn-sm">My Orders</a>
      </div>
    </div>
  </header>

  <!-- Success Content -->
  <main style="padding: 3rem 0 5rem;">
    <div class="container">
      
      <div id="orderSuccessContent" class="success-card">
        <div style="text-align: center; padding: 4rem;">
          <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--primary);"></i>
          <p style="margin-top: 0.5rem; color: var(--text-muted);">Fetching receipt...</p>
        </div>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const orderNumber = urlParams.get('orderNumber');

    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('orderSuccessContent');
      if (!orderNumber) {
        container.innerHTML = `
          <div style="text-align: center;">
            <h2>No order found</h2>
            <a href="/shop.html" class="btn btn-primary" style="margin-top: 1rem;">Go to Shop</a>
          </div>
        `;
        return;
      }

      try {
        const res = await API.get(`/orders/details/${orderNumber}`);
        const order = res.order;

        container.innerHTML = `
          <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 72px; height: 72px; border-radius: 50%; background: #ecfdf5; color: var(--success); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto 1.25rem;">
              <i class="fa-solid fa-circle-check"></i>
            </div>
            <span class="badge badge-success" style="font-size: 0.8rem; margin-bottom: 0.5rem;">Payment Verified</span>
            <h1 style="font-size: 2rem; margin-bottom: 0.4rem;">Order Successfully Placed!</h1>
            <p style="color: var(--text-muted); font-size: 1rem;">
              Order Number: <strong style="color: var(--text-main); font-family: 'Outfit'; font-size: 1.15rem;">${order.order_number}</strong>
            </p>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">
              A confirmation email has been dispatched to <strong>${order.customer_email}</strong>.
            </p>
          </div>

          <!-- Timeline -->
          <div class="timeline-steps">
            <div class="timeline-step completed">
              <div class="step-icon"><i class="fa-solid fa-check"></i></div>
              <span style="font-size: 0.82rem; font-weight: 600;">Placed</span>
            </div>
            <div class="timeline-step ${order.order_status !== 'pending' ? 'completed' : 'active'}">
              <div class="step-icon"><i class="fa-solid fa-box"></i></div>
              <span style="font-size: 0.82rem; font-weight: 600;">Processing</span>
            </div>
            <div class="timeline-step ${['shipped', 'delivered'].includes(order.order_status) ? 'completed' : ''}">
              <div class="step-icon"><i class="fa-solid fa-truck"></i></div>
              <span style="font-size: 0.82rem; font-weight: 600;">Shipped</span>
            </div>
            <div class="timeline-step ${order.order_status === 'delivered' ? 'completed' : ''}">
              <div class="step-icon"><i class="fa-solid fa-house-chimney"></i></div>
              <span style="font-size: 0.82rem; font-weight: 600;">Delivered</span>
            </div>
          </div>

          <!-- Order Summary Details -->
          <div style="border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 2rem;">
            <div style="background: var(--bg-muted); padding: 0.85rem 1.25rem; font-weight: 700; font-size: 0.95rem;">
              Purchased Items (${order.items.length})
            </div>
            <div style="padding: 1.25rem;">
              ${order.items.map(item => `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; padding-bottom: 0.85rem; border-bottom: 1px solid var(--border);">
                  <div>
                    <div style="font-weight: 600; font-size: 0.95rem;">${item.product_name}</div>
                    <div style="font-size: 0.82rem; color: var(--text-muted);">Qty: ${item.quantity} × ${API.formatPrice(item.product_price)}</div>
                  </div>
                  <div style="font-weight: 700; font-family: 'Outfit'; font-size: 1rem;">
                    ${API.formatPrice(item.subtotal)}
                  </div>
                </div>
              `).join('')}

              <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem; font-size: 0.9rem;">
                <span style="color: var(--text-muted);">Subtotal</span>
                <span>${API.formatPrice(order.subtotal)}</span>
              </div>
              ${order.discount_amount > 0 ? `
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--accent);">
                  <span>Discount Coupon (${order.coupon_code || 'PROMO'})</span>
                  <span>-${API.formatPrice(order.discount_amount)}</span>
                </div>
              ` : ''}
              <div style="display: flex; justify-content: space-between; margin-bottom: 0.75rem; font-size: 0.9rem;">
                <span style="color: var(--text-muted);">Delivery Fee</span>
                <span>${order.shipping_fee === 0 ? 'FREE' : API.formatPrice(order.shipping_fee)}</span>
              </div>
              <div style="display: flex; justify-content: space-between; border-top: 2px dashed var(--border); padding-top: 0.75rem; font-size: 1.25rem; font-weight: 800; font-family: 'Outfit';">
                <span>Total Paid</span>
                <span style="color: var(--primary);">${API.formatPrice(order.total_amount)}</span>
              </div>
            </div>
          </div>

          <!-- Shipping & Payment info box -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem;">
            <div style="background: var(--bg-main); padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border);">
              <h4 style="font-size: 0.95rem; margin-bottom: 0.5rem; color: var(--primary);"><i class="fa-solid fa-location-dot"></i> Shipping Destination</h4>
              <p style="font-size: 0.88rem; line-height: 1.5; color: var(--text-main);">
                <strong>${order.customer_name}</strong><br>
                ${order.address.street || ''}<br>
                ${order.address.city || ''}, ${order.address.state || ''} - ${order.address.postal_code || ''}<br>
                Phone: ${order.customer_phone}
              </p>
            </div>

            <div style="background: var(--bg-main); padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid var(--border);">
              <h4 style="font-size: 0.95rem; margin-bottom: 0.5rem; color: var(--primary);"><i class="fa-solid fa-credit-card"></i> Payment Information</h4>
              <p style="font-size: 0.88rem; line-height: 1.5; color: var(--text-main);">
                <strong>Method:</strong> ${order.payment_method.toUpperCase()}<br>
                <strong>Status:</strong> <span class="badge badge-success">${order.payment_status}</span><br>
                <strong>Date:</strong> ${new Date(order.created_at).toLocaleDateString()}
              </p>
            </div>
          </div>

          <!-- Action Buttons -->
          <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
            <button class="btn btn-secondary" onclick="window.print()">
              <i class="fa-solid fa-print"></i> Print Invoice
            </button>
            <a href="/orders.html" class="btn btn-secondary">
              <i class="fa-solid fa-box-archive"></i> View All Orders
            </a>
            <a href="/shop.html" class="btn btn-primary">
              <i class="fa-solid fa-bag-shopping"></i> Continue Shopping
            </a>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div style="color: var(--danger); text-align: center;">Error loading order: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
